name : React Client

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-lastest

  steps:
    - name: SSH로 EC2 접속하여 작업
      uses: alppleboy/ssh-action@1.2.2

      with:
        host: ${{secrets.EC2_HOST}}
        username: ${{secrets.USERNAME}}
        key: ${{secrets.EC2_PRIVATE_KEY}}

        scipt: |
          cd /home/ubuntu/client
          git pull origin main
          
          docker stop reactclient || true
          docker rm reactclient || true

          docker build -t reactclient .

          docker run -d --name reactclient -p 80:80 reactclient



